{% extends "base.html" %}
{% block title %}Cart - Bean Shop{% endblock %}
{% block content %}
<h1>Your cart</h1>
<div id="cart-items"></div>
<p>Total: <span id="cart-total">0.00</span></p>

<h2>Shipping details</h2>
<p id="error" role="alert"></p>
<form id="checkout-form">
  <label for="name">Name</label>
  <input id="name" name="name" required maxlength="100">

  <label for="email">Email</label>
  <input id="email" name="email" type="email" required maxlength="100">

  <label for="phone">Phone</label>
  <input id="phone" name="phone" type="tel" required maxlength="100">

  <label for="address_line">Address</label>
  <input id="address_line" name="address_line" required maxlength="100">

  <label for="city">City</label>
  <input id="city" name="city" required maxlength="100">

  <label for="postal_code">Postal code</label>
  <input id="postal_code" name="postal_code" required maxlength="100">

  <label for="country">Country</label>
  <input id="country" name="country" required maxlength="100">

  <button type="submit">Place order</button>
</form>
{% endblock %}
